name: Build macOS Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel   # Intel (x86_64) runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show
          rustup target add x86_64-apple-darwin
          rustc -vV

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-intel-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create OpenWave.app
        run: |
          APP=OpenWave.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/x86_64-apple-darwin/release/openwave "$APP/Contents/MacOS/openwave"

          # Icon: PNG -> .icns
          ICONSET=openwave.iconset
          mkdir "$ICONSET"
          SRC=assets/branding/openwave-icon-512.png
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          cp "$ICONSET/icon_32x32.png"   "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png"   "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png"
          rm "$ICONSET/icon_64x64.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/openwave.icns"

          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenWave</string>
            <key>CFBundleDisplayName</key><string>OpenWave</string>
            <key>CFBundleIdentifier</key><string>com.openwave.player</string>
            <key>CFBundleExecutable</key><string>openwave</string>
            <key>CFBundleIconFile</key><string>openwave</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign (not notarized)
          codesign --force --deep -s - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" OpenWave-macos-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWave-macos-x86_64
          path: OpenWave-macos-x86_64.zip
